spring:
  application:
    name: booking-service

  # Simplificação local: carrega as variáveis do .env da raiz do projeto.
  # Em container, as variáveis vêm do ambiente e o arquivo não existe (por isso "optional").
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5434/booking_db}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

server:
  port: 8081
